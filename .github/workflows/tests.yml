name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the run it replaces
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node (for pyright)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Lint and type check
        run: |
          ruff check guard tests
          pyright

  test:
    # Windows is where guard is used most; Linux and macOS run the tests Windows skips (POSIX
    # permission bits, symlinks) and the process-group paths of the agent CLI and discovery code.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests compare the reviewer with an earlier commit's behaviour

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node (the omp, pi and opencode extensions are run under Node)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest tests -q
