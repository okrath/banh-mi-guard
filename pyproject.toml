[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banh-mi-guard"
version = "0.17.6"
description = "Banh Mi Guard: dual-gate impact analysis & regression guard for AI coding agents (scope, invariants, build, Alibaba Open Code Review rules and LLM review)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Orca Team", email = "30043763+trungngoprogramming@users.noreply.github.com" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.16.10",
    "pyright==1.1.414",
]

[project.scripts]
guard = "guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guard*"]

[tool.pytest.ini_options]
# A bare `pytest` imports this checkout's own packages (`guard`, and `bench`, which is not installed)
# instead of an editable install that may point at another checkout or worktree.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["guard"]
pythonVersion = "3.10"
